# Tostadora Incremental (G09) — frontend (único nodo expuesto, vía Cloudflare Tunnel)
# Se instala con instalar_nginx.sh, que reemplaza __HUELLA__ por el hash del script de index.html.

# Límites de peticiones por IP real del visitante
limit_req_zone $binary_remote_addr zone=api:10m  rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_status 429;

server {
    # Solo localhost (lo usa cloudflared) y la IP de Tailscale (pruebas desde el PC)
    listen 127.0.0.1:80;
    listen 100.99.15.111:80;
    server_name _;

    server_tokens off;            # no revelar la versión de Nginx
    root /var/www/tostadora;
    index index.html;
    client_max_body_size 16k;     # la API solo recibe JSON pequeños

    # IP real: cloudflared se conecta desde localhost y envía la IP del visitante
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    # Visitante que llegó a Cloudflare por http:// -> redirigir a https:// (hallazgo ZAP 10047).
    # Cloudflare informa el esquema original en la cabecera CF-Visitor.
    if ($http_cf_visitor ~ '"scheme":"http"') {
        return 301 https://$host$request_uri;
    }

    # Cabeceras de seguridad
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' __HUELLA__ 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Compresión (el build de Unity va sin comprimir)
    gzip on;
    gzip_types application/javascript application/wasm application/octet-stream text/css;
    gzip_min_length 1024;

    # Nunca servir archivos ocultos (.env, .git...)
    location ~ /\. { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }

    # Login y registro: límite estricto contra fuerza bruta
    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://100.95.114.35:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Resto de la API
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://100.95.114.35:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 40s;   # Tosti puede tardar
    }
}
